[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-whoop"
version = "0.2.1"
description = "A Django app for the WHOOP API (v2), backed by django-healthdatamodel."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Andy Reagan", email = "andy@andyreagan.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = [
    "django",
    "django-healthdatamodel>=0.8.0",
    "httpx",
    "pydantic>=2",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/django-health/django-whoop"
Repository = "https://github.com/django-health/django-whoop"
Issues = "https://github.com/django-health/django-whoop/issues"

[tool.hatch.build.targets.wheel]
packages = ["whoop"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "respx",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
markers = [
    "live: requires real WHOOP OAuth credentials in env (WHOOP_TEST_*)",
]
